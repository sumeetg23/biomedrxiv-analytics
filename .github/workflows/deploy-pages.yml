name: Deploy Web Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      active_release_tag: ${{ steps.ledger.outputs.active_release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Hydrate versioned DuckDB-Wasm Parquet tables from active GitHub Release
        id: ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --quiet requests
          python scripts/manage_data_release.py hydrate-web \
            --ledger web/data/releases.json \
            --allow-local-fallback
          TAG=$(python -c "import json, pathlib; p = pathlib.Path('web/data/releases.json'); print(json.loads(p.read_text()).get('active_release_tag', '') if p.exists() else '')")
          echo "active_release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  promote-and-sync-vectorize:
    needs: [build, deploy]
    if: ${{ needs.build.outputs.active_release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Promote staged GitHub Release to Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --quiet requests
          python scripts/manage_data_release.py promote \
            --tag "${{ needs.build.outputs.active_release_tag }}"

      - name: Sync pre-computed embeddings to Cloudflare Vectorize (0 Neurons)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "[skip] CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN secrets not set; skipping Vectorize sync."
            exit 0
          fi
          python scripts/manage_data_release.py hydrate-base \
            --tag "${{ needs.build.outputs.active_release_tag }}" \
            --include-prereleases \
            --rag-only
          if [ -f data/processed/rag_corpus.jsonl ] && [ -f data/cache/rag_embeddings_bge_small.jsonl ]; then
            python scripts/upload_vectorize.py --ensure-index
          else
            echo "[skip] Release ${{ needs.build.outputs.active_release_tag }} did not contain RAG corpus/embeddings."
          fi
