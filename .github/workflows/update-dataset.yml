name: Automated Dataset Update, Quality Gates & Release PR

on:
  schedule:
    # Weekly on Sundays at 08:00 UTC
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-validate-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run unit tests before data sync
        run: .venv/bin/pytest -v

      - name: Run full hybrid sync (Kaggle base + live bioRxiv/medRxiv API delta), ETL, trials & quality gates
        id: pipeline
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          .venv/bin/python scripts/run_pipeline.py \
            --source both \
            --enrich-nct \
            --dedup-ror \
            --use-gemini \
            --output-markdown logs/release_digest.md

      - name: Upload quality report & update logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-digest-and-logs
          path: |
            logs/release_digest.md
            data/registry.json

      - name: Open Pull Request if dashboard_data.json updated
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "data: automated Bio&Med-Rxiv dataset refresh"
          branch: "automated/dataset-refresh"
          delete-branch: true
          title: "Automated Dataset Refresh & Quality Gate Digest"
          body-path: logs/release_digest.md
          add-paths: |
            web/data/dashboard_data.json
          labels: |
            automated-data-update
