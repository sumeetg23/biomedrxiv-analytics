name = "biomedrxiv-gemini-proxy"
main = "src/index.js"
compatibility_date = "2026-11-01"

[ai]
binding = "AI"

[vars]
GEMINI_MODEL = "gemini-4-hydrogen"
GEMINI_FALLBACK_MODELS = "gemini-4-argon,gemini-3.5-flash-lite"
GROQ_MODELS = "openai/gpt-oss-120b,qwen/qwen3.8-27b"
WORKERS_AI_MODELS = "@cf/meta/llama-3.1-8b-instruct-fast,@cf/meta/llama-3.1-8b-instruct-fp8"
ALLOWED_ORIGINS = "https://sumeetg23.github.io,http://127.0.0.1:8080,http://localhost:8080"
RATE_LIMIT_MAX = "20"
RATE_LIMIT_WINDOW_SEC = "600"

# Set secrets via Cloudflare Dashboard (Settings -> Runtime variables and secrets) or CLI:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put GROQ_API_KEY
